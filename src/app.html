<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      (() => {
        const reloadKey = 'qa-app-reloaded-after-missing-asset';
        const isAppAsset = (url) => typeof url === 'string' && url.includes('/_app/immutable/');
        const reloadOnce = () => {
          if (sessionStorage.getItem(reloadKey)) return;
          sessionStorage.setItem(reloadKey, '1');
          const url = new URL(window.location.href);
          url.searchParams.set('__app_reload', Date.now().toString());
          window.location.replace(url.toString());
        };

        window.addEventListener('vite:preloadError', (event) => {
          event.preventDefault();
          reloadOnce();
        });

        window.addEventListener('error', (event) => {
          const target = event.target;
          const url = target && ('src' in target ? target.src : 'href' in target ? target.href : '');
          if (isAppAsset(url)) reloadOnce();
        }, true);

        window.addEventListener('load', () => {
          sessionStorage.removeItem(reloadKey);
          const url = new URL(window.location.href);
          if (url.searchParams.has('__app_reload')) {
            url.searchParams.delete('__app_reload');
            window.history.replaceState(window.history.state, '', url.toString());
          }
        });
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-prerender="false">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
